<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Tracker & Pomodoro</title>
    <!-- Quill.js CSS -->
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --border: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 2rem;
        }

        /* --- Top Bar for Goal Selection --- */
        .top-bar {
            width: 100%;
            max-width: 1200px;
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            align-items: center;
        }

        .goal-selector {
            flex-grow: 1;
            padding: 0.8rem;
            background-color: var(--surface-color);
            color: var(--text-main);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
        }

        .btn-new-goal {
            background-color: var(--primary);
            color: white;
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .btn-new-goal:hover { background-color: var(--primary-hover); }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2rem;
            max-width: 1200px;
            width: 100%;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
            .top-bar {
                flex-direction: column;
                align-items: stretch;
            }
        }

        .panel {
            background-color: var(--surface-color);
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            position: relative; /* For subtle delete button positioning */
        }

        h2 {
            margin-bottom: 1.5rem;
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* --- Timer Styles --- */
        .timer-display {
            font-size: 5rem;
            font-weight: 700;
            text-align: center;
            margin: 2rem 0;
            font-variant-numeric: tabular-nums;
            letter-spacing: -2px;
        }

        .mode-indicator {
            text-align: center;
            font-size: 1.2rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .session-counter {
            text-align: center;
            margin-bottom: 2rem;
            color: var(--primary);
            font-weight: bold;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }

        button {
            padding: 0.8rem 1.5rem;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            color: white;
        }

        .btn-start { background-color: var(--success); }
        .btn-start:hover { background-color: #059669; }
        .btn-pause { background-color: var(--warning); }
        .btn-pause:hover { background-color: #d97706; }
        .btn-reset { background-color: var(--border); color: var(--text-main); }
        .btn-reset:hover { background-color: #444444; }
        .btn-skip { background-color: var(--primary); }
        .btn-skip:hover { background-color: var(--primary-hover); }

        .btn-delete {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            background: transparent;
            color: var(--danger);
            opacity: 0.2;
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border: 1px solid var(--danger);
            transition: opacity 0.3s ease;
        }
        .btn-delete:hover {
            opacity: 1;
            background: rgba(239, 68, 68, 0.1);
        }

        /* --- Goal Styles --- */
        .form-group {
            margin-bottom: 1rem;
        }
        
        .form-row {
            display: flex;
            gap: 1rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        input[type="text"], input[type="date"], input[type="number"] {
            width: 100%;
            padding: 0.8rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-main);
            font-size: 1rem;
        }

        /* Circular Progress */
        .progress-container {
            display: flex;
            align-items: center;
            gap: 2rem;
            margin-bottom: 2rem;
            background: rgba(0,0,0,0.2);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .progress-circle {
            position: relative;
            width: 120px;
            height: 120px;
        }

        .progress-circle svg {
            width: 120px;
            height: 120px;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: var(--border);
            stroke-width: 10;
        }

        .circle-progress {
            fill: none;
            stroke: var(--primary);
            stroke-width: 10;
            stroke-linecap: round;
            transition: stroke-dashoffset 0.5s ease;
        }

        .progress-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 1.2rem;
            font-weight: bold;
        }

        .goal-stats h3 {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .goal-stats p {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        /* Quill Editor overrides for Dark Mode */
        .ql-toolbar {
            background-color: var(--bg-color);
            border-color: var(--border) !important;
            border-radius: 8px 8px 0 0;
        }
        .ql-container {
            border-color: var(--border) !important;
            border-radius: 0 0 8px 8px;
            min-height: 200px;
            font-size: 1rem;
        }
        .ql-editor { color: var(--text-main); }
        .ql-stroke { stroke: var(--text-muted) !important; }
        .ql-fill { fill: var(--text-muted) !important; }
        .ql-picker { color: var(--text-muted) !important; }
    </style>
</head>
<body>

    <!-- Top Bar for Multi-Goal Management -->
    <div class="top-bar">
        <select id="goal-selector" class="goal-selector" onchange="switchGoal()"></select>
        <button class="btn-new-goal" onclick="createNewGoal()">+ New Goal</button>
    </div>

    <div class="container">
        <!-- Pomodoro Panel -->
        <div class="panel">
            <h2>Pomodoro Timer</h2>
            <div class="mode-indicator" id="mode-text">Study Time</div>
            <div class="timer-display" id="timer">25:00</div>
            <div class="session-counter" id="session-count">Completed sessions: 0</div>
            
            <div class="controls">
                <button class="btn-start" id="btn-start" onclick="startTimer()">Start</button>
                <button class="btn-pause" id="btn-pause" onclick="pauseTimer()" style="display: none;">Pause</button>
                <button class="btn-reset" onclick="resetTimer()">Reset</button>
                <button class="btn-skip" onclick="skipPhase()">Skip Phase</button>
            </div>

            <!-- Subtle Delete Button -->
            <button class="btn-delete" onclick="deleteCurrentGoal()">Delete Current Goal</button>
        </div>

        <!-- Goal & Notes Panel -->
        <div class="panel">
            <h2>Your Goal</h2>
            
            <div class="progress-container">
                <div class="progress-circle">
                    <svg>
                        <circle class="circle-bg" cx="60" cy="60" r="50"></circle>
                        <circle class="circle-progress" id="progress-bar" cx="60" cy="60" r="50"></circle>
                    </svg>
                    <div class="progress-text" id="progress-percent">0%</div>
                </div>
                <div class="goal-stats">
                    <h3 id="display-goal-name">No goal selected</h3>
                    <p id="display-goal-date">Event: -</p>
                    <p id="display-goal-time">Study: 0h / 0h</p>
                </div>
            </div>

            <div class="form-group">
                <label>Event Name (e.g., Test, Competition)</label>
                <input type="text" id="input-name" placeholder="e.g., Physics Exam" onchange="saveInputData()">
            </div>
            
            <div class="form-row">
                <div class="form-group" style="flex: 1;">
                    <label>Event Date</label>
                    <input type="date" id="input-date" onchange="saveInputData()">
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Estimated time (h)</label>
                    <input type="number" id="input-hours" min="1" placeholder="e.g., 400" onchange="saveInputData()">
                </div>
            </div>

            <div class="form-group" style="margin-top: 1rem; flex-grow: 1; display: flex; flex-direction: column;">
                <label>Notes & Tasks</label>
                <!-- Quill Editor Container -->
                <div id="editor"></div>
            </div>
        </div>
    </div>

    <!-- Quill.js for Rich Text Editor -->
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <script>
        // --- EDITOR INITIALIZATION ---
        const quill = new Quill('#editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'bullet' }, { 'list': 'check' }]
                ]
            },
            placeholder: 'Write down your conclusions, study plan, or check off tasks...'
        });

        // --- CONSTANTS & STATE ---
        const CONSTANTS = {
            WORK: 25 * 60,
            SHORT_BREAK: 5 * 60,
            LONG_BREAK: 30 * 60,
            CIRCLE_CIRCUMFERENCE: 2 * Math.PI * 50
        };

        // Default structure for a single goal/timer
        function createDefaultGoalState(name = 'My First Goal') {
            return {
                id: 'goal_' + Date.now(),
                goal: { name: name, date: '', targetHours: 0, loggedSeconds: 0, notes: '' },
                pomodoro: { timeLeft: CONSTANTS.WORK, mode: 'work', sessionsCompleted: 0 }
            };
        }

        let appState = {
            activeGoalId: null,
            goals: {}
        };

        let timerInterval = null;

        // --- INITIALIZATION ---
        
        function init() {
            document.getElementById('progress-bar').style.strokeDasharray = CONSTANTS.CIRCLE_CIRCUMFERENCE;
            loadData();
            
            // Listen for text editor changes
            quill.on('text-change', () => {
                const currentGoal = appState.goals[appState.activeGoalId];
                if (currentGoal) {
                    currentGoal.goal.notes = quill.root.innerHTML;
                    saveData();
                }
            });
        }

        function loadData() {
            const saved = localStorage.getItem('studyTrackerAppState');
            if (saved) {
                appState = JSON.parse(saved);
                // Fallback if data is corrupted or empty
                if (Object.keys(appState.goals).length === 0) {
                    const newGoal = createDefaultGoalState();
                    appState.goals[newGoal.id] = newGoal;
                    appState.activeGoalId = newGoal.id;
                }
            } else {
                const newGoal = createDefaultGoalState();
                appState.goals[newGoal.id] = newGoal;
                appState.activeGoalId = newGoal.id;
            }
            
            updateGoalSelector();
            loadActiveGoal();
        }

        function saveData() {
            localStorage.setItem('studyTrackerAppState', JSON.stringify(appState));
        }

        // --- MULTI-GOAL MANAGEMENT ---

        function updateGoalSelector() {
            const selector = document.getElementById('goal-selector');
            selector.innerHTML = '';
            
            Object.values(appState.goals).forEach(goalData => {
                const option = document.createElement('option');
                option.value = goalData.id;
                option.textContent = goalData.goal.name || 'Unnamed Goal';
                if (goalData.id === appState.activeGoalId) {
                    option.selected = true;
                }
                selector.appendChild(option);
            });
        }

        function createNewGoal() {
            pauseTimer(); // Stop timer of current goal
            const newGoal = createDefaultGoalState('New Goal ' + (Object.keys(appState.goals).length + 1));
            appState.goals[newGoal.id] = newGoal;
            appState.activeGoalId = newGoal.id;
            
            saveData();
            updateGoalSelector();
            loadActiveGoal();
        }

        function switchGoal() {
            pauseTimer();
            const selector = document.getElementById('goal-selector');
            appState.activeGoalId = selector.value;
            saveData();
            loadActiveGoal();
        }

        function deleteCurrentGoal() {
            if (!confirm('Are you sure you want to delete this goal and its timer?')) return;
            
            pauseTimer();
            delete appState.goals[appState.activeGoalId];
            
            // If no goals left, create a default one
            if (Object.keys(appState.goals).length === 0) {
                const newGoal = createDefaultGoalState();
                appState.goals[newGoal.id] = newGoal;
                appState.activeGoalId = newGoal.id;
            } else {
                // Select the first available goal
                appState.activeGoalId = Object.keys(appState.goals)[0];
            }
            
            saveData();
            updateGoalSelector();
            loadActiveGoal();
        }

        function loadActiveGoal() {
            const activeData = appState.goals[appState.activeGoalId];
            if (!activeData) return;

            // Load Inputs
            document.getElementById('input-name').value = activeData.goal.name;
            document.getElementById('input-date').value = activeData.goal.date;
            document.getElementById('input-hours').value = activeData.goal.targetHours || '';
            
            // Load Notes without triggering 'text-change' listener loop
            quill.root.innerHTML = activeData.goal.notes || '';

            updateGoalUI();
            updateTimerUI();
        }

        // --- GOAL LOGIC ---

        function saveInputData() {
            const activeData = appState.goals[appState.activeGoalId];
            activeData.goal.name = document.getElementById('input-name').value;
            activeData.goal.date = document.getElementById('input-date').value;
            activeData.goal.targetHours = parseFloat(document.getElementById('input-hours').value) || 0;
            
            updateGoalSelector(); // Update dropdown text if name changed
            updateGoalUI();
            saveData();
        }

        // Format yyyy-mm-dd to dd/mm/yyyy
        function formatDateToDMY(dateString) {
            if (!dateString) return '-';
            const parts = dateString.split('-');
            if (parts.length === 3) {
                return `${parts[2]}/${parts[1]}/${parts[0]}`;
            }
            return dateString;
        }

        function updateGoalUI() {
            const activeData = appState.goals[appState.activeGoalId];
            
            // Texts
            document.getElementById('display-goal-name').innerText = activeData.goal.name || 'No goal name';
            document.getElementById('display-goal-date').innerText = `Event: ${formatDateToDMY(activeData.goal.date)}`;
            
            // Progress Calculation
            const loggedHours = (activeData.goal.loggedSeconds / 3600).toFixed(1);
            const target = activeData.goal.targetHours;
            
            document.getElementById('display-goal-time').innerText = `Study: ${loggedHours}h / ${target}h`;

            let percent = 0;
            if (target > 0) {
                percent = Math.min((activeData.goal.loggedSeconds / (target * 3600)) * 100, 100);
            }

            document.getElementById('progress-percent').innerText = `${Math.floor(percent)}%`;

            // Circular Progress Bar Update
            const offset = CONSTANTS.CIRCLE_CIRCUMFERENCE - (percent / 100) * CONSTANTS.CIRCLE_CIRCUMFERENCE;
            document.getElementById('progress-bar').style.strokeDashoffset = offset;
        }

        // --- TIMER LOGIC ---

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function updateTimerUI() {
            const activeData = appState.goals[appState.activeGoalId];
            
            document.getElementById('timer').innerText = formatTime(activeData.pomodoro.timeLeft);
            document.getElementById('session-count').innerText = `Completed sessions: ${activeData.pomodoro.sessionsCompleted}`;
            
            const modeText = document.getElementById('mode-text');
            if (activeData.pomodoro.mode === 'work') {
                modeText.innerText = "Study Time";
                modeText.style.color = "var(--primary)";
            } else if (activeData.pomodoro.mode === 'shortBreak') {
                modeText.innerText = "Short Break";
                modeText.style.color = "var(--success)";
            } else {
                modeText.innerText = "Long Break";
                modeText.style.color = "var(--warning)";
            }

            // Browser Title Bar
            document.title = `${formatTime(activeData.pomodoro.timeLeft)} - ${activeData.pomodoro.mode === 'work' ? 'Study' : 'Break'}`;
        }

        function startTimer() {
            if (timerInterval) return;
            
            document.getElementById('btn-start').style.display = 'none';
            document.getElementById('btn-pause').style.display = 'block';

            timerInterval = setInterval(() => {
                const activeData = appState.goals[appState.activeGoalId];
                activeData.pomodoro.timeLeft--;

                // Log time if in 'work' mode
                if (activeData.pomodoro.mode === 'work') {
                    activeData.goal.loggedSeconds++;
                    // Update UI periodically
                    if (activeData.goal.loggedSeconds % 60 === 0) {
                        updateGoalUI();
                    }
                }

                if (activeData.pomodoro.timeLeft <= 0) {
                    handlePhaseComplete();
                }

                updateTimerUI();
                saveData(); 
            }, 1000);
        }

        function pauseTimer() {
            if(timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
            document.getElementById('btn-start').style.display = 'block';
            document.getElementById('btn-pause').style.display = 'none';
            saveData();
        }

        function resetTimer() {
            pauseTimer();
            const activeData = appState.goals[appState.activeGoalId];
            
            if (activeData.pomodoro.mode === 'work') activeData.pomodoro.timeLeft = CONSTANTS.WORK;
            else if (activeData.pomodoro.mode === 'shortBreak') activeData.pomodoro.timeLeft = CONSTANTS.SHORT_BREAK;
            else activeData.pomodoro.timeLeft = CONSTANTS.LONG_BREAK;
            
            updateTimerUI();
            saveData();
        }

        function handlePhaseComplete() {
            pauseTimer();
            // Play notification sound
            try {
                new Audio('https://actions.google.com/sounds/v1/alarms/beep_short.ogg').play();
            } catch(e) {}

            skipPhase();
        }

        function skipPhase() {
            pauseTimer();
            const activeData = appState.goals[appState.activeGoalId];
            
            if (activeData.pomodoro.mode === 'work') {
                activeData.pomodoro.sessionsCompleted++;
                if (activeData.pomodoro.sessionsCompleted > 0 && activeData.pomodoro.sessionsCompleted % 4 === 0) {
                    activeData.pomodoro.mode = 'longBreak';
                    activeData.pomodoro.timeLeft = CONSTANTS.LONG_BREAK;
                } else {
                    activeData.pomodoro.mode = 'shortBreak';
                    activeData.pomodoro.timeLeft = CONSTANTS.SHORT_BREAK;
                }
            } else {
                // Break ended -> return to work
                activeData.pomodoro.mode = 'work';
                activeData.pomodoro.timeLeft = CONSTANTS.WORK;
            }

            updateGoalUI();
            updateTimerUI();
            saveData();
        }

        // Run application on load
        window.addEventListener('DOMContentLoaded', init);

    </script>
</body>
</html>
